name: sentinel sweep
on:
  schedule:
    - cron: "10 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: run sweep
        run: node run.js
      - name: heartbeat commit (keeps the schedule alive past GitHub's 60-day inactivity cutoff)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > LAST_RUN.txt
          git config user.name "sentinel"
          git config user.email "izworskic@users.noreply.github.com"
          git add LAST_RUN.txt
          git commit -m "sweep heartbeat" || exit 0
          git push
